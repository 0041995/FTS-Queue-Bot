name: Build & Release

# v1.7.1: 不再"任何 push 到 main 就自动发版"。发布必须由维护者打 v* tag 或手动触发。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 校验 VERSION 与 tag 一致
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION)"
          echo "VERSION=$VERSION"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 VERSION ${VERSION} 不一致"
            exit 1
          fi

      - name: 构建单文件脚本与校验和
        run: python3 build/build.py

      - name: 校验 bash 语法
        run: |
          bash -n dist/autofts.sh
          echo "bash 语法 OK"

      - name: 校验 PowerShell 语法
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'dist/autofts.ps1'), [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Error "行 $($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host "PowerShell 语法 OK"

      - name: 校验内嵌引擎与更新器
        run: |
          node --version
          node --check src/core.js
          node --check src/probe.js
          node --check src/update.js
          node --check dist/update.js
          echo "引擎语法 OK"

      - name: 回归测试（全部 14 项）
        run: |
          npm install ethers@6.15.0 --no-audit --no-fund --ignore-scripts --no-save
          node test/sendtx-nonce.js
          node test/approve-guard.js
          node test/claims-flex.js
          node test/semaphore-concurrency.js 8
          node test/semaphore-concurrency.js 16
          node test/rate-limits.js
          node test/node-pool.js
          node test/wallet-crypto.js
          node test/web-sync.js
          node test/trade.js
          node test/safety-guards.js
          node test/update-vercmp.js
          node test/release-consistency.js
          node test/perf-guards.js

      - name: 校验发行版校验和
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: 发布 / 覆盖 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d ' \r\n' < VERSION)"
          TAG="v${VERSION}"
          ASSETS=(dist/autofts.sh dist/autofts.ps1 dist/update.sh dist/update.ps1 dist/update.js dist/SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件并更新说明"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            echo "创建 Release $TAG"
            gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
          gh release view "$TAG" --json tagName,assets --jq '.tagName, (.assets[].name)'
